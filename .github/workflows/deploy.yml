# Builds the site and publishes it to GitHub Pages.
# Based on https://docs.astro.build/en/guides/deploy/github/
# Requires Settings → Pages → Source to be "GitHub Actions" (already configured).

name: Deploy to GitHub Pages

on:
  # Deploy on every push to `main`.
  push:
    branches: [main]
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

# Let the workflow read the repository and create a Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at once; queued pushes wait for the current one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v7

      - name: Install, build, and upload your site
        uses: withastro/action@v6
        with:
          # This project uses Bun (bun.lock). Stated explicitly so the build
          # does not depend on lockfile detection.
          package-manager: bun@latest
          # path: . # Root of the Astro project inside the repository (optional)
          # node-version: 24 # Node version used to build the site, defaults to 24 (optional)

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
